<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supercars Battle - Duelo de Cartas</title>
    <style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Bangers&display=swap');

:root{
  --bg1:#1b0b4a; --bg2:#4a1a8c; --pink:#ff2e93; --cyan:#00e5ff;
  --yellow:#ffd60a; --green:#2ee59d; --orange:#ff8a1f; --ink:#1b1340;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Fredoka','Segoe UI',sans-serif;color:#fff;min-height:100vh;
  display:flex;flex-direction:column;align-items:center;padding:12px 12px 90px;
  background:
    radial-gradient(circle at 15% 10%,rgba(255,46,147,.35),transparent 40%),
    radial-gradient(circle at 85% 90%,rgba(0,229,255,.30),transparent 45%),
    linear-gradient(160deg,var(--bg1),var(--bg2));
  background-attachment:fixed;overflow-x:hidden;
}
/* racing stripes */
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.07;
  background:repeating-linear-gradient(115deg,#fff 0 12px,transparent 12px 60px)}

h1{
  font-family:'Bangers',cursive;font-weight:400;font-size:2.4rem;letter-spacing:3px;margin:8px 0 12px;
  color:var(--yellow);text-align:center;transform:rotate(-2deg);
  text-shadow:3px 3px 0 var(--pink),6px 6px 0 rgba(0,0,0,.35);
}

/* MENU */
#menu{
  width:100%;max-width:400px;padding:18px;margin-bottom:14px;text-align:center;border-radius:22px;
  background:rgba(255,255,255,.12);backdrop-filter:blur(8px);
  border:3px solid rgba(255,255,255,.25);box-shadow:0 8px 0 rgba(0,0,0,.25);
}
#controles-iniciales{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
input{
  font-family:inherit;font-size:1.1rem;font-weight:600;color:var(--ink);text-align:center;
  padding:10px;border-radius:14px;border:3px solid var(--cyan);width:130px;outline:none;
}
input:focus{box-shadow:0 0 0 4px rgba(0,229,255,.4)}
button{
  font-family:inherit;font-weight:700;font-size:1rem;color:#fff;cursor:pointer;text-transform:uppercase;
  padding:11px 20px;border:none;border-radius:16px;background:var(--pink);
  box-shadow:0 5px 0 #b3125f;transition:transform .1s,box-shadow .1s;
}
button:hover{transform:translateY(-2px)}
button:active{transform:translateY(4px);box-shadow:0 1px 0 #b3125f}
#areaCreador p{margin-bottom:12px;font-size:1.1rem}
#areaCreador button{background:var(--green)!important;color:var(--ink);box-shadow:0 5px 0 #14935f;font-size:1.15rem;animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}

#infoPartida{
  font-weight:700;font-size:1rem;margin-bottom:16px;padding:8px 22px;border-radius:30px;
  background:linear-gradient(90deg,var(--orange),var(--pink));box-shadow:0 5px 0 rgba(0,0,0,.3);
  text-align:center;
}

/* CARDS */
#cartaJugador{display:flex;flex-wrap:wrap;justify-content:center;gap:18px;width:100%}
#cartaJugador h3{font-size:1.4rem;color:var(--yellow)}
.card{
  position:relative;width:92vw;max-width:340px;padding:14px;border-radius:24px;color:var(--ink);
  background:linear-gradient(160deg,#fff 0%,#f3ecff 100%);
  border:6px solid transparent;
  background-clip:padding-box;
  box-shadow:0 0 0 6px var(--cyan),0 0 0 9px var(--pink),0 18px 0 rgba(0,0,0,.25);
  animation:pop .35s ease-out;
}
@keyframes pop{from{transform:scale(.85) rotate(-3deg);opacity:0}}
.card h2{
  font-family:'Bangers',cursive;font-weight:400;font-size:1.5rem;letter-spacing:1.5px;text-align:center;
  margin-bottom:10px;color:#fff!important;padding:4px 8px;border-radius:12px;
  background:linear-gradient(90deg,var(--bg2),var(--pink));
}
.card img{width:100%;height:160px;object-fit:cover;border-radius:16px;margin-bottom:12px;border:4px solid var(--ink)}

.grid-stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.stat-btn{
  display:flex!important;flex-direction:column!important;align-items:center!important;gap:1px;
  color:var(--ink)!important;-webkit-text-fill-color:var(--ink)!important;text-shadow:none!important;
  font-size:.8rem!important;font-weight:600!important;text-transform:none!important;
  padding:8px 4px!important;border-radius:14px!important;border:3px solid var(--ink)!important;
  background:#fff!important;box-shadow:0 4px 0 var(--ink)!important;
}
.stat-btn::before{font-size:1.3rem}
.stat-btn:nth-child(1)::before{content:"🔧"} .stat-btn:nth-child(2)::before{content:"📏"}
.stat-btn:nth-child(3)::before{content:"⚙️"} .stat-btn:nth-child(4)::before{content:"↔️"}
.stat-btn:nth-child(5)::before{content:"🐎"} .stat-btn:nth-child(6)::before{content:"↕️"}
.stat-btn:nth-child(7)::before{content:"🚀"} .stat-btn:nth-child(8)::before{content:"⚖️"}
.stat-btn:nth-child(9)::before{content:"⏱️"} .stat-btn:nth-child(10)::before{content:"⛽"}
.stat-btn:nth-child(odd){background:#e6fbff!important}
.stat-btn:nth-child(even){background:#fff0f7!important}
.stat-btn:hover{background:var(--yellow)!important;transform:translateY(-3px)!important}
.stat-btn:active{transform:translateY(3px)!important;box-shadow:0 1px 0 var(--ink)!important}
.stat-btn b{
  color:var(--pink)!important;-webkit-text-fill-color:var(--pink)!important;
  font-family:'Bangers',cursive;font-weight:400!important;font-size:1.25rem!important;letter-spacing:1px;
}

/* DUEL */
.duelo-container{position:relative}
.estrella{position:absolute;top:-28px;right:-10px;font-size:54px;z-index:100;
  filter:drop-shadow(0 0 10px gold);animation:bounce .6s infinite alternate}
@keyframes bounce{to{transform:translateY(-12px) rotate(10deg)}}
.card.revelada{width:44vw;max-width:175px;padding:8px;box-shadow:0 0 0 4px var(--cyan),0 10px 0 rgba(0,0,0,.25)}
.card.revelada h2{font-size:.95rem}
.card.revelada img{height:80px;border-width:3px}
.card.revelada small{font-weight:700;color:var(--bg2)}
.card.revelada b{font-family:'Bangers',cursive;font-weight:400;font-size:1.6rem;color:var(--pink)}
.card.ganadora{box-shadow:0 0 0 5px var(--yellow),0 0 40px 10px var(--yellow);animation:win .6s ease-out}
@keyframes win{40%{transform:scale(1.12) rotate(2deg)}}
.empate-border{box-shadow:0 0 0 5px var(--green),0 0 30px var(--green)!important}
.bloqueo{
  position:absolute;inset:0;z-index:10;display:flex;justify-content:center;align-items:center;text-align:center;
  padding:20px;border-radius:18px;font-weight:700;font-size:1.2rem;color:var(--ink)!important;
  background:rgba(255,255,255,.88)!important;backdrop-filter:blur(3px);
}

/* CHAT (floating, never needs scrolling) */
#chat-container{position:fixed;right:14px;bottom:14px;z-index:1000;width:auto;max-width:none;margin:0;padding:0;background:none;border:none}
#chat-fab{
  position:relative;display:block;margin-left:auto;width:62px;height:62px;padding:0;border-radius:50%;
  font-size:1.8rem;background:var(--cyan);box-shadow:0 5px 0 #0092a6;
}
#chat-badge{
  position:absolute;top:-6px;right:-6px;min-width:26px;height:26px;border-radius:13px;padding:0 6px;
  background:var(--pink);color:#fff;font-size:.9rem;line-height:26px;border:3px solid #fff;display:none;
  animation:pulse .8s infinite;
}
#chat-panel{
  display:none;flex-direction:column;width:min(92vw,360px);margin-bottom:12px;padding:12px;border-radius:20px;
  background:rgba(27,11,74,.96);border:3px solid var(--cyan);box-shadow:0 8px 0 rgba(0,0,0,.35);
}
#chat-container.open #chat-panel{display:flex}
#chat-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:700;color:var(--yellow)}
#chat-close{padding:2px 10px;font-size:1rem;box-shadow:0 3px 0 #b3125f}
#lista-mensajes{height:170px;overflow-y:auto;font-size:.95rem;margin-bottom:10px}
#lista-mensajes::-webkit-scrollbar{width:6px}
#lista-mensajes::-webkit-scrollbar-thumb{background:var(--cyan);border-radius:10px}
.msg{background:rgba(255,255,255,.12);padding:6px 12px;border-radius:14px;margin-bottom:6px;word-break:break-word}
.chat-input-area{display:flex;gap:8px}
#inputChat{flex-grow:1;width:auto;margin:0;padding:8px;text-align:left;font-size:1rem}
.chat-input-area button{padding:8px 14px;background:var(--green);color:var(--ink);box-shadow:0 4px 0 #14935f}

/* pop-up toast: new message appears on screen without scrolling */
#chat-toast{
  position:fixed;left:50%;top:14px;transform:translate(-50%,-150%);z-index:2000;
  width:min(92vw,380px);padding:12px 16px;border-radius:18px;font-weight:600;cursor:pointer;
  background:#fff;color:var(--ink);border:4px solid var(--pink);box-shadow:0 8px 0 rgba(0,0,0,.3);
  transition:transform .35s cubic-bezier(.3,1.6,.5,1);
}
#chat-toast.show{transform:translate(-50%,0)}

@media(max-width:360px){h1{font-size:1.9rem}.stat-btn{font-size:.7rem!important}}

/* mobile fix: keep the send button inside the chat panel */
#inputChat{min-width:0;flex:1 1 auto}
.chat-input-area button{flex:0 0 auto}
#chat-panel{max-height:70vh;max-height:70dvh}

</style>
    <link rel="icon" href="data:,">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
    <h1>🏎️ Supercars Battle 🏁</h1>

    <div id="menu">
        <div id="controles-iniciales">
            <button onclick="crearPartida()">🎮 Crear Partida</button>
            <input type="number" id="codigoInput" placeholder="Código">
            <button onclick="unirsePartida()">🚪 Unirse</button>
        </div>
        <div id="areaCreador" style="display:none;">
            <p>Esperando jugadores...</p>
            <button onclick="iniciarJuego()">🏁 ¡EMPEZAR YA!</button>
        </div>
    </div>

    <div id="infoPartida">Conéctate para jugar</div>
    <div id="cartaJugador"></div>

    <div id="chat-container" style="display:none;">
        <div id="chat-panel">
            <div id="chat-head"><span>💬 Chat</span><button id="chat-close" onclick="document.getElementById('chat-container').classList.remove('open')">✖</button></div>
            <div id="lista-mensajes"></div>
            <div class="chat-input-area">
                <input type="text" id="inputChat" placeholder="Escribe un mensaje...">
                <button onclick="enviarMensaje()">Enviar</button>
            </div>
        </div>
        <button id="chat-fab" onclick="document.getElementById('chat-container').classList.toggle('open')">💬<span id="chat-badge"></span></button>
    </div>
    <div id="chat-toast"></div>

    <script src="app.js"></script>
    <script>
// Chat UI helpers: open/close panel, unread badge, pop-up toast for new messages.
(function(){
  const box=document.getElementById('chat-container');
  const list=document.getElementById('lista-mensajes');
  const badge=document.getElementById('chat-badge');
  const toast=document.getElementById('chat-toast');
  let unread=0,prev=null,timer=null;

  function open(v){
    box.classList.toggle('open',v);
    if(v){unread=0;badge.style.display='none';toast.classList.remove('show');
      list.scrollTop=list.scrollHeight;document.getElementById('inputChat').focus();}
  }
  document.getElementById('chat-fab').onclick=()=>open(!box.classList.contains('open'));
  document.getElementById('chat-close').onclick=()=>open(false);
  toast.onclick=()=>open(true);

  new MutationObserver(()=>{
    const n=list.children.length;
    if(prev===null){prev=n;return;}
    if(n>prev){
      const last=list.lastElementChild;
      const mine=last.textContent.trim().startsWith('TÚ');
      if(!mine&&!box.classList.contains('open')){
        unread+=n-prev;badge.textContent=unread;badge.style.display='block';
        toast.textContent='💬 '+last.textContent;toast.classList.add('show');
        clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),4000);
      }
    }
    prev=n;
  }).observe(list,{childList:true});
})();

// Safer chat: escapes HTML before sending, so nobody can break the page with <tags>.
// This replaces enviarMensaje() from app.js (ui.js is loaded after it).
function enviarMensaje() {
  const input = document.getElementById("inputChat");
  let texto = input.value.trim().slice(0, 200);
  if (!texto || !partidaId) return;
  texto = texto.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
               .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  db.ref(`partidas/${partidaId}/mensajes`).push({
    autor: jugadorId,
    texto: texto,
    timestamp: Date.now()
  });
  input.value = "";
}

</script>
</body>
</html>
